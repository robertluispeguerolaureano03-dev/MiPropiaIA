<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert IA - Asistente Inteligente</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #212121; color: #ececec; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 260px; background-color: #171717; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; border-right: 1px solid #2f2f2f; }
        .new-chat-btn { background: transparent; border: 1px solid #424242; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; transition: 0.2s; }
        .new-chat-btn:hover { background: #212121; }
        .chat-history { flex: 1; margin-top: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; color: #b4b4b4; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: #212121; color: #fff; }
        
        .user-profile { border-top: 1px solid #2f2f2f; padding-top: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #ab68ff; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        .user-info { display: flex; flex-direction: column; font-size: 13px; }
        .user-name { font-weight: bold; color: #fff; }
        .user-status { color: #10a37f; font-size: 11px; }

        #main-content { flex: 1; display: flex; flex-direction: column; background-color: #212121; position: relative; }
        header { padding: 15px 20px; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; justify-content: space-between; }
        .model-selector { background: #2f2f2f; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 20px; }
        .message-row { display: flex; gap: 15px; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-bubble { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .user .message-bubble { background-color: #2f2f2f; color: #fff; border-bottom-right-radius: 4px; }
        .ai .message-bubble { background-color: transparent; color: #ececec; border-bottom-left-radius: 4px; }
        
        #input-container { padding: 20px 15%; background: #212121; }
        .input-box { background: #2f2f2f; border-radius: 24px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border: 1px solid #424242; }
        .input-box textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; resize: none; font-size: 15px; max-height: 150px; font-family: inherit; }
        .btn-send { background: #fff; color: #000; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .footer-text { text-align: center; font-size: 11px; color: #8e8e8e; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <span>+</span> Nuevo chat
            </button>
            <div class="chat-history" id="chat-history">
                <div class="history-item">Chat Principal</div>
            </div>
        </div>
        
        <div class="user-profile" onclick="loginPrompt()">
            <div class="avatar" id="user-avatar">R</div>
            <div class="user-info">
                <span class="user-name" id="user-display-name">Robert (Admin)</span>
                <span class="user-status">● Sesión Activa</span>
            </div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <select class="model-selector">
                <option>Robert IA (Ilimitado Infinito)</option>
            </select>
        </header>

        <div id="chat-container">
            <div class="message-row ai">
                <div class="avatar" style="background:#10a37f;">R</div>
                <div class="message-bubble">Hola, soy <b>Robert IA</b>. Estoy listo para responderte sin ningún límite de cuota. ¿En qué te ayudo hoy?</div>
            </div>
        </div>

        <div id="input-container">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Envía un mensaje a Robert IA..." onkeydown="handleKey(event)"></textarea>
                <button class="btn-send" onclick="sendMessage()">↑</button>
            </div>
            <div class="footer-text">Robert IA versión ilimitada. Respuestas continuas.</div>
        </div>
    </div>

    <script>
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function loginPrompt() {
            const name = prompt("Ingrese su nombre de usuario para la sesión:", "Robert");
            if (name) {
                document.getElementById("user-display-name").textContent = name;
                document.getElementById("user-avatar").textContent = name.charAt(0).toUpperCase();
            }
        }

        function startNewChat() {
            const container = document.getElementById("chat-container");
            container.innerHTML = `
                <div class="message-row ai">
                    <div class="avatar" style="background:#10a37f;">R</div>
                    <div class="message-bubble">Hola, soy <b>Robert IA</b>. He iniciado un nuevo chat ilimitado. ¿Qué deseas consultar?</div>
                </div>
            `;
        }

        async function fetchUnlimitedResponse(promptText) {
            const systemPrompt = "Tu nombre es Robert IA, una inteligencia artificial avanzada, servicial y profesional. Responde siempre en español. Pregunta: " + promptText;
            
            const seed = Math.floor(Math.random() * 999999);
            const endpoints = [
                async () => {
                    const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(systemPrompt) + "?model=mistral&seed=" + seed);
                    return await res.text();
                },
                async () => {
                    const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(systemPrompt) + "?model=llama&seed=" + seed);
                    return await res.text();
                },
                async () => {
                    const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(systemPrompt) + "?model=openai&seed=" + seed);
                    return await res.text();
                }
            ];

            for (let fn of endpoints) {
                try {
                    let resText = await fn();
                    if (resText && !resText.includes("budget") && !resText.includes("error") && resText.length > 2) {
                        return resText;
                    }
                } catch(e) {}
            }

            return "Hubo una breve interrupción de conexión. Por favor vuelve a intentar tu pregunta.";
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById("chat-container");

            const userRow = document.createElement("div");
            userRow.className = "message-row user";
            userRow.innerHTML = `<div class="message-bubble">${text}</div>`;
            container.appendChild(userRow);

            input.value = "";
            container.scrollTop = container.scrollHeight;

            const aiRow = document.createElement("div");
            aiRow.className = "message-row ai";
            aiRow.innerHTML = `
                <div class="avatar" style="background:#10a37f;">R</div>
                <div class="message-bubble">Robert IA está pensando...</div>
            `;
            container.appendChild(aiRow);
            container.scrollTop = container.scrollHeight;

            const aiBubble = aiRow.querySelector(".message-bubble");

            const reply = await fetchUnlimitedResponse(text);
            aiBubble.textContent = reply;

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
